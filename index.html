<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คลังเอกสาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&family=Trirong:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FDF3F6;
    --surface:#FFFFFF;
    --ink:#3B1E2B;
    --ink-2:#8E6577;
    --rule:#F2DCE4;
    --rose:#B23A63;
    --rose-deep:#8E2A4C;
    --blush:#FBE7EE;
    --petal:#E9789F;
    --shadow:0 1px 2px rgba(122,42,70,.06),0 8px 24px rgba(122,42,70,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Sarabun',sans-serif;
    font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:920px;margin:0 auto;padding:0 20px}

  /* ---- แถบบน ---- */
  header{
    background:linear-gradient(180deg,#FFF0F5 0%,#FFFFFF 100%);
    border-bottom:1px solid var(--rule);
    box-shadow:0 1px 0 rgba(178,58,99,.04);
  }
  .bar{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap;padding:12px 0}
  .mark{font-family:'Trirong',serif;font-weight:600;font-size:22px;letter-spacing:-.01em;color:var(--rose-deep)}
  .mark span{color:var(--ink-2);font-family:'Sarabun',sans-serif;font-weight:400;font-size:13px;margin-left:12px}
  .bar-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

  button{font-family:'Sarabun',sans-serif;font-size:14px;font-weight:500;cursor:pointer;
         border-radius:7px;transition:background .14s,border-color .14s,color .14s}
  .btn{background:var(--rose);color:#fff;border:1px solid var(--rose);padding:8px 16px;
       box-shadow:0 1px 2px rgba(142,42,76,.18)}
  .btn:hover{background:var(--rose-deep);border-color:var(--rose-deep)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn-quiet{background:var(--surface);color:var(--rose);border:1px solid var(--rule);padding:8px 14px}
  .btn-quiet:hover{background:var(--blush);border-color:#EBC4D3}
  .btn-stamp{background:transparent;color:#A33A3A;border:1px solid #EFD0D0;padding:8px 14px}
  .btn-stamp:hover{background:#FCF0F0}
  :focus-visible{outline:2px solid var(--petal);outline-offset:2px}

  /* ---- แถบแจ้งโหมดทดลอง ---- */
  .note{background:#FCEBF2;border-bottom:1px solid #F3D3E0;font-size:13px;color:#8E2A4C}
  .note div{max-width:920px;margin:0 auto;padding:9px 20px}

  /* ---- ช่องค้นหา ---- */
  .hero{padding:42px 0 24px}
  .search-wrap{position:relative}
  #q{
    width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:12px;
    padding:17px 20px 17px 50px;font-family:'Sarabun',sans-serif;font-size:19px;color:var(--ink);
    box-shadow:var(--shadow);
  }
  #q::placeholder{color:#C4A2B1}
  #q:focus{border-color:var(--petal);outline:none;box-shadow:0 0 0 4px rgba(233,120,159,.16)}
  .search-icon{position:absolute;left:19px;top:50%;transform:translateY(-50%);color:var(--petal)}
  .count{font-size:13.5px;color:var(--ink-2);margin-top:12px}

  /* ---- ตัวกรอง ---- */
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:18px;
           border-bottom:1px solid var(--rule)}
  select{font-family:'Sarabun',sans-serif;font-size:13.5px;color:var(--ink);background:var(--surface);
         border:1px solid var(--rule);border-radius:7px;padding:7px 11px}
  select:focus{border-color:var(--petal);outline:none}
  .view-toggle{margin-left:auto;display:flex;border:1px solid var(--rule);border-radius:7px;
               overflow:hidden;background:var(--surface)}
  .view-toggle button{border:0;background:transparent;color:var(--ink-2);padding:7px 14px;border-radius:0}
  .view-toggle button[aria-pressed="true"]{background:var(--rose);color:#fff}

  /* ---- รายการเอกสาร ---- */
  .results{padding:8px 0 64px}
  .row{display:flex;gap:14px;background:var(--surface);border:1px solid var(--rule);
       border-left-width:5px;border-radius:10px;padding:15px 17px;margin-top:10px;cursor:pointer;
       box-shadow:0 1px 2px rgba(122,42,70,.04);transition:box-shadow .16s,transform .16s,border-color .16s}
  .row:hover{box-shadow:var(--shadow);border-color:#EBC4D3}
  .row-main{flex:1;min-width:0}
  .rid{font-size:11.5px;color:var(--petal);letter-spacing:.05em;font-weight:500}
  .rtitle{font-family:'Trirong',serif;font-weight:600;font-size:17.5px;margin:2px 0 4px;line-height:1.4}
  .rmeta{font-size:12.5px;color:var(--ink-2)}
  .rmeta i{font-style:normal;color:#E7C9D6;margin:0 8px}
  .rsum{color:var(--ink-2);font-size:13.5px;margin-top:6px;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11.5px;color:var(--rose);background:var(--blush);border-radius:999px;padding:2px 10px}
  .thumbs{display:flex;gap:6px;flex-shrink:0}
  .thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--rule);
              background:var(--blush)}
  .th{width:56px;height:56px;border-radius:8px;border:1px solid var(--rule);display:flex;
      align-items:center;justify-content:center;font-size:20px;background:var(--blush)}
  .filecount{font-size:12px;color:var(--ink-2);align-self:center;white-space:nowrap}
  .cancelled{opacity:.48}

  /* ---- แกลเลอรี ---- */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;padding:18px 0 64px}
  .gcell{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden;
         cursor:pointer;box-shadow:0 1px 2px rgba(122,42,70,.04);transition:box-shadow .16s}
  .gcell:hover{box-shadow:var(--shadow)}
  .gcell img{width:100%;height:136px;object-fit:cover;display:block;background:var(--blush)}
  .gtile{height:136px;display:flex;align-items:center;justify-content:center;font-size:34px}
  .gcap{padding:8px 10px;font-size:12.5px;color:var(--ink-2);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- สถานะว่าง ---- */
  .empty{background:var(--surface);border:1px dashed #EBC4D3;border-radius:12px;
         padding:48px 28px;text-align:center;margin-top:20px}
  .empty h3{font-family:'Trirong',serif;font-weight:600;margin:0 0 8px;font-size:19px;color:var(--rose-deep)}
  .empty p{color:var(--ink-2);margin:0 0 20px}

  /* ---- แผงด้านข้าง ---- */
  .scrim{position:fixed;inset:0;background:rgba(59,30,43,.36);opacity:0;pointer-events:none;
         transition:opacity .18s}
  .scrim.open{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;height:100%;width:min(540px,100%);background:var(--surface);
         border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .24s ease-out;
         display:flex;flex-direction:column;z-index:10;box-shadow:-16px 0 40px rgba(122,42,70,.10)}
  .panel.open{transform:translateX(0)}
  @media (prefers-reduced-motion:reduce){.panel,.scrim,.row{transition:none}}
  .panel-head{display:flex;align-items:center;gap:10px;padding:18px 24px;
              border-bottom:1px solid var(--rule);background:linear-gradient(180deg,#FFF4F8,#FFFFFF)}
  .panel-head h2{font-family:'Trirong',serif;font-size:18px;font-weight:600;margin:0;color:var(--rose-deep)}
  .panel-body{padding:22px 24px;overflow-y:auto;flex:1}
  .panel-foot{padding:15px 24px;border-top:1px solid var(--rule);display:flex;gap:8px;
              align-items:center;flex-wrap:wrap;background:#FFFAFC}
  .x{margin-left:auto;background:none;border:0;color:var(--ink-2);font-size:22px;line-height:1;padding:4px 8px}
  .x:hover{color:var(--rose)}

  label{display:block;font-size:12.5px;color:var(--ink-2);margin:16px 0 6px;font-weight:500}
  input[type=text],input[type=date],textarea{
    width:100%;font-family:'Sarabun',sans-serif;font-size:14.5px;color:var(--ink);background:var(--surface);
    border:1px solid var(--rule);border-radius:8px;padding:9px 12px}
  input:focus,textarea:focus{border-color:var(--petal);outline:none;
    box-shadow:0 0 0 3px rgba(233,120,159,.14)}
  textarea{resize:vertical;min-height:70px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{font-size:12px;color:var(--ink-2);margin-top:5px}
  .drop{border:1px dashed #EBC4D3;border-radius:8px;padding:16px;color:var(--ink-2);
        font-size:13.5px;background:#FFFAFC}
  .filelist{margin-top:10px;font-size:13px;color:var(--ink-2)}
  .filelist div{padding:4px 0;border-bottom:1px solid var(--rule)}
  .status{font-size:13px;color:var(--rose)}
  .status.err{color:#A33A3A}
  .kv{display:grid;grid-template-columns:104px 1fr;gap:7px 12px;font-size:14px;margin-bottom:18px}
  .kv dt{font-size:12.5px;color:var(--ink-2)}
  .kv dd{margin:0}
  .attach{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule);
          font-size:13.5px}
  .attach img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--rule)}
  .attach a{color:var(--ink);text-decoration:none}
  .attach a:hover{color:var(--rose);text-decoration:underline}

  @media(max-width:640px){
    .hero{padding:26px 0 16px}
    #q{font-size:17px;padding:15px 16px 15px 46px}
    .thumbs{display:none}
    .two{grid-template-columns:1fr}
    .mark{font-size:19px}
  }
  .setup-msg{background:var(--surface);border:1px dashed #EBC4D3;border-radius:12px;
             padding:40px 28px;text-align:center;margin:40px 0}
  .setup-msg h3{font-family:'Trirong',serif;font-weight:600;margin:0 0 8px;font-size:19px;
                color:var(--rose-deep)}
  .setup-msg p{color:var(--ink-2);margin:0}
  code{background:var(--blush);border-radius:4px;padding:2px 7px;font-size:13px}
</style>
</head>
<body>

<div id="app">

<header>
  <div class="shell bar">
    <div class="mark">คลังเอกสาร<span>สพป.เชียงใหม่ เขต 2</span></div>
    <div class="bar-actions">
      <button class="btn-quiet" id="btnImport">นำเข้าไฟล์เดิม</button>
      <button class="btn-quiet" id="btnFolder">เปิดโฟลเดอร์</button>
      <button class="btn" id="btnAdd">เพิ่มเอกสาร</button>
    </div>
  </div>
</header>

<div class="shell">
  <div class="hero">
    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path>
      </svg>
      <input id="q" type="text" placeholder="พิมพ์คำที่จำได้ ชื่อเรื่อง เลขที่หนังสือ หรือคำในเนื้อเอกสาร" autocomplete="off">
    </div>
    <div class="count" id="count">กำลังเปิดคลัง…</div>
  </div>

  <div class="filters">
    <select id="fYear"><option value="">ทุกปีงบประมาณ</option></select>
    <select id="fType"><option value="">ทุกประเภท</option></select>
    <select id="fProject"><option value="">ทุกโครงการ</option></select>
    <select id="fStatus">
      <option value="ใช้งาน">ใช้งาน</option>
      <option value="">รวมที่ยกเลิก</option>
    </select>
    <div class="view-toggle">
      <button id="vList" aria-pressed="true">รายการ</button>
      <button id="vGrid" aria-pressed="false">แกลเลอรี</button>
    </div>
  </div>

  <div id="results" class="results"></div>
</div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="addPanel">
  <div class="panel-head"><h2>เพิ่มเอกสาร</h2><button class="x" data-close>&times;</button></div>
  <div class="panel-body">
    <label for="aTitle">ชื่อเรื่อง</label>
    <input type="text" id="aTitle" placeholder="เช่น รายงานผลการนิเทศภาคเรียนที่ 1">
    <div class="two">
      <div><label for="aType">ประเภทเอกสาร</label><select id="aType" style="width:100%"></select></div>
      <div><label for="aNumber">เลขที่หนังสือ / คำสั่ง</label><input type="text" id="aNumber" placeholder="เว้นว่างได้"></div>
    </div>
    <div class="two">
      <div><label for="aDate">วันที่ของเอกสาร</label><input type="date" id="aDate"></div>
      <div><label for="aFy">ปีงบประมาณ</label><input type="text" id="aFy" placeholder="2569"></div>
    </div>
    <label for="aProject">โครงการที่เกี่ยวข้อง</label>
    <input type="text" id="aProject" list="projectList" placeholder="เช่น Active Learning 2569">
    <datalist id="projectList"></datalist>
    <label for="aTags">คำสำคัญ</label>
    <input type="text" id="aTags" list="tagList" placeholder="คั่นด้วยจุลภาค เช่น นิเทศ, PISA, แม่แตง">
    <datalist id="tagList"></datalist>
    <label for="aSummary">สรุปย่อ</label>
    <textarea id="aSummary" placeholder="2–3 บรรทัดว่าเอกสารนี้เกี่ยวกับอะไร ใช้ตอนไหน"></textarea>
    <div class="hint">ช่องนี้มีผลกับการค้นหามากที่สุด เขียนด้วยคำที่คุณจะนึกถึงในอีกหนึ่งปี</div>
    <label>ไฟล์แนบ</label>
    <div class="drop">
      <input type="file" id="aFiles" multiple>
      <div class="hint">แนบได้หลายไฟล์ ขนาดไม่เกิน 20 MB ต่อไฟล์</div>
    </div>
    <div class="filelist" id="aFileList"></div>
  </div>
  <div class="panel-foot">
    <button class="btn" id="btnSave">บันทึกเข้าคลัง</button>
    <button class="btn-quiet" data-close>ยกเลิก</button>
    <span class="status" id="saveStatus"></span>
  </div>
</aside>

<aside class="panel" id="viewPanel">
  <div class="panel-head"><h2 id="vId">รายละเอียด</h2><button class="x" data-close>&times;</button></div>
  <div class="panel-body" id="vBody"></div>
  <div class="panel-foot">
    <button class="btn-quiet" id="btnOcr">อ่านข้อความในไฟล์</button>
    <button class="btn-stamp" id="btnCancelDoc">ยกเลิกเอกสาร</button>
    <span class="status" id="viewStatus"></span>
  </div>
</aside>

<script>
/* ============ ตั้งค่าครั้งเดียวตรงนี้ ============ */
var API_URL   = 'https://script.google.com/macros/s/AKfycbyqqvbFGZt2whkSSFlIw1yeNNddMnkxjinyz-kNEZWMkX0J8hJrhPDh5yUDT9V4MDlG/exec';
var API_TOKEN = 'cm2-arch-7f3k9d2569';
/* =============================================== */
var DATA = { docs: [], docTypes: [], projects: [], years: [], tags: [], folderUrl: '#' };
var VIEW = 'list', CURRENT = null;
var PALETTE = ['#B23A63','#D4636F','#8E4A7D','#C97B3E','#6E7BA8','#4E8C7A','#A8557A','#7B5E9A'];

function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function typeColor(t){
  var i = DATA.docTypes.indexOf(t);
  if (i < 0) i = String(t||'').length;
  return PALETTE[Math.abs(i) % PALETTE.length];
}
function thumb(id){ return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w400'; }

/* ---------- คุยกับ Apps Script ---------- */
function call(action, payload){
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: API_TOKEN, action: action, payload: payload || {} })
  }).then(function(r){ return r.json(); })
    .then(function(j){
      if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาดที่ฝั่งสคริปต์');
      return j.data;
    });
}

function setStatusEl(id,msg,isErr){
  var s = el(id); s.textContent = msg; s.className = 'status' + (isErr?' err':'');
}

/* ---------- โหลดข้อมูล ---------- */
function load(){
  call('load').then(onLoad).catch(function(e){
    el('count').textContent = 'เปิดคลังไม่สำเร็จ: ' + e.message;
  });
}
function onLoad(res){
  DATA = res;
  fillSelect(el('fYear'),   DATA.years,    'ทุกปีงบประมาณ');
  fillSelect(el('fType'),   DATA.docTypes, 'ทุกประเภท');
  fillSelect(el('fProject'),DATA.projects, 'ทุกโครงการ');
  fillOptions(el('aType'),  DATA.docTypes);
  fillDatalist(el('projectList'), DATA.projects);
  fillDatalist(el('tagList'), DATA.tags);
  render();
}
function fillSelect(sel, items, allLabel){
  var v = sel.value;
  sel.innerHTML = '<option value="">' + allLabel + '</option>';
  items.forEach(function(i){ sel.insertAdjacentHTML('beforeend','<option>'+esc(i)+'</option>'); });
  sel.value = v;
}
function fillOptions(sel, items){
  sel.innerHTML = '';
  items.forEach(function(i){ sel.insertAdjacentHTML('beforeend','<option>'+esc(i)+'</option>'); });
}
function fillDatalist(dl, items){
  dl.innerHTML = '';
  items.forEach(function(i){ dl.insertAdjacentHTML('beforeend','<option value="'+esc(i)+'">'); });
}

/* ---------- ค้นหาและแสดงผล ---------- */
function matches(d){
  if (el('fYear').value    && d.fiscalYear !== el('fYear').value) return false;
  if (el('fType').value    && d.docType    !== el('fType').value) return false;
  if (el('fProject').value && d.project    !== el('fProject').value) return false;
  if (el('fStatus').value  && d.status     !== el('fStatus').value) return false;
  var q = el('q').value.trim().toLowerCase();
  if (!q) return true;
  var hay = (d.searchText + ' ' + d.docId + ' ' + d.title).toLowerCase();
  return q.split(/\s+/).every(function(t){ return hay.indexOf(t) > -1; });
}

function render(){
  var list = DATA.docs.filter(matches);
  el('count').textContent = DATA.docs.length
    ? 'พบ ' + list.length + ' รายการ จากทั้งหมด ' + DATA.docs.length + ' รายการในคลัง'
    : 'คลังยังว่างอยู่';

  var box = el('results');
  if (!DATA.docs.length){
    box.className = 'results';
    box.innerHTML = '<div class="empty"><h3>ยังไม่มีเอกสารในคลัง</h3>' +
      '<p>เริ่มจากเพิ่มเอกสารแรก หรือดึงไฟล์ที่มีอยู่แล้วในโฟลเดอร์เข้าระบบ</p>' +
      '<button class="btn" onclick="openAdd()">เพิ่มเอกสารแรก</button></div>';
    return;
  }
  if (!list.length){
    box.className = 'results';
    box.innerHTML = '<div class="empty"><h3>ไม่พบเอกสารที่ตรงกับที่ค้น</h3>' +
      '<p>ลองใช้คำสั้นลง หรือล้างตัวกรองด้านบน</p>' +
      '<button class="btn-quiet" onclick="clearFilters()">ล้างตัวกรอง</button></div>';
    return;
  }
  box.className = VIEW === 'grid' ? 'gallery' : 'results';
  box.innerHTML = VIEW === 'grid' ? gridHtml(list) : listHtml(list);
}

function listHtml(list){
  return list.map(function(d){
    var imgs = d.files.filter(function(f){ return f.isImage; }).slice(0,3);
    var tags = String(d.tags||'').split(',').map(function(t){return t.trim();}).filter(Boolean);
    var meta = [d.docType, d.docDate, d.docNumber, 'ปีงบ ' + d.fiscalYear]
                 .filter(Boolean).map(esc).join('<i>/</i>');
    return '<div class="row' + (d.status==='ยกเลิก'?' cancelled':'') + '"' +
      ' style="border-left-color:' + typeColor(d.docType) + '"' +
      ' onclick="openView(\'' + d.docId + '\')">' +
      '<div class="row-main">' +
        '<div class="rid">' + esc(d.docId) + '</div>' +
        '<div class="rtitle">' + esc(d.title) + '</div>' +
        '<div class="rmeta">' + meta + '</div>' +
        (d.summary ? '<div class="rsum">' + esc(d.summary) + '</div>' : '') +
        (tags.length ? '<div class="tags">' + tags.map(function(t){
            return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
      '</div>' +
      (imgs.length
        ? '<div class="thumbs">' + imgs.map(function(f){
            return '<img loading="lazy" src="' + thumb(f.fileId) + '" alt="">'; }).join('') + '</div>'
        : '<div class="filecount">' + d.files.length + ' ไฟล์</div>') +
      '</div>';
  }).join('');
}

function gridHtml(list){
  var cells = [];
  list.forEach(function(d){
    d.files.filter(function(f){ return f.isImage; }).forEach(function(f){
      cells.push('<div class="gcell" onclick="openView(\'' + d.docId + '\')">' +
        '<img loading="lazy" src="' + thumb(f.fileId) + '" alt="">' +
        '<div class="gcap">' + esc(d.title) + '</div></div>');
    });
  });
  return cells.length ? cells.join('')
    : '<div class="empty"><h3>ไม่มีรูปภาพในผลลัพธ์นี้</h3><p>สลับกลับไปมุมมองรายการเพื่อดูเอกสารทั้งหมด</p></div>';
}

function clearFilters(){
  ['fYear','fType','fProject'].forEach(function(id){ el(id).value=''; });
  el('q').value=''; render();
}

/* ---------- แผง ---------- */
function openPanel(p){ el('scrim').classList.add('open'); el(p).classList.add('open'); }
function closePanels(){
  el('scrim').classList.remove('open');
  el('addPanel').classList.remove('open');
  el('viewPanel').classList.remove('open');
}
function openAdd(){
  el('saveStatus').textContent='';
  el('aFy').value = thaiFiscalYear(new Date());
  el('aDate').valueAsDate = new Date();
  openPanel('addPanel');
  el('aTitle').focus();
}
function thaiFiscalYear(d){
  var y = d.getFullYear() + 543;
  if (d.getMonth() >= 9) y += 1;
  return y;
}

function openView(docId){
  var d = DATA.docs.filter(function(x){ return x.docId === docId; })[0];
  if (!d) return;
  CURRENT = d;
  el('vId').textContent = d.docId;
  el('viewStatus').textContent = '';
  el('btnCancelDoc').textContent = d.status === 'ยกเลิก' ? 'กลับมาใช้งาน' : 'ยกเลิกเอกสาร';

  var tags = String(d.tags||'').split(',').map(function(t){return t.trim();}).filter(Boolean);
  var html = '<div class="rtitle" style="font-size:19px;margin-bottom:12px">' + esc(d.title) + '</div>' +
    '<dl class="kv">' +
      kv('ประเภท', d.docType) + kv('เลขที่', d.docNumber) + kv('วันที่', d.docDate) +
      kv('ปีงบประมาณ', d.fiscalYear) + kv('โครงการ', d.project) + kv('สถานะ', d.status) +
    '</dl>';
  if (d.summary) html += '<p style="margin:0 0 14px">' + esc(d.summary) + '</p>';
  if (tags.length) html += '<div class="tags" style="margin-bottom:16px">' +
      tags.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>';

  html += '<label style="margin-top:4px">ไฟล์แนบ ' + d.files.length + ' ไฟล์</label>';
  d.files.forEach(function(f){
    html += '<div class="attach">' +
      (f.isImage ? '<img src="' + thumb(f.fileId) + '" alt="">' : '<span style="width:40px;text-align:center">📄</span>') +
      '<a href="' + f.viewUrl + '" target="_blank" rel="noopener">' + esc(f.fileName) + '</a></div>';
  });
  if (d.hasText) html += '<div class="hint" style="margin-top:14px">อ่านข้อความในไฟล์ไว้แล้ว ค้นหาคำในเนื้อเอกสารนี้ได้</div>';

  el('vBody').innerHTML = html;
  openPanel('viewPanel');
}
function kv(k,v){ return v ? '<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>' : ''; }

/* ---------- บันทึกเอกสารใหม่ ---------- */
function saveDoc(){
  var meta = {
    title:      el('aTitle').value.trim(),
    docType:    el('aType').value,
    docNumber:  el('aNumber').value.trim(),
    docDate:    el('aDate').value,
    fiscalYear: el('aFy').value.trim(),
    project:    el('aProject').value.trim(),
    tags:       el('aTags').value.trim(),
    summary:    el('aSummary').value.trim()
  };
  if (!meta.title){ setSave('ใส่ชื่อเรื่องก่อนบันทึก', true); el('aTitle').focus(); return; }

  var files = Array.prototype.slice.call(el('aFiles').files);
  var tooBig = files.filter(function(f){ return f.size > 20*1024*1024; });
  if (tooBig.length){
    setSave('ไฟล์ ' + tooBig[0].name + ' ใหญ่เกิน 20 MB ให้ลากเข้า Drive ตรง ๆ แล้วกดนำเข้าไฟล์เดิมแทน', true);
    return;
  }

  el('btnSave').disabled = true;
  setSave('กำลังสร้างรายการ…');
  call('create', meta).then(function(ref){
    return uploadAll(ref, files, 0);
  }).then(function(ref){
    setSave('บันทึกแล้ว ' + ref.docId);
    resetForm();
    el('btnSave').disabled = false;
    load();
    setTimeout(closePanels, 700);
  }).catch(function(e){
    el('btnSave').disabled = false;
    setSave(e.message, true);
  });
}

function uploadAll(ref, files, i){
  if (i >= files.length) return Promise.resolve(ref);
  var f = files[i];
  setSave('กำลังอัปโหลด ' + (i+1) + '/' + files.length + ' — ' + f.name);
  return readAsBase64(f).then(function(b64){
    return call('upload', {
      docId: ref.docId, folderId: ref.folderId,
      name: f.name, mimeType: f.type || 'application/octet-stream', data: b64
    });
  }).then(function(){ return uploadAll(ref, files, i+1); });
}

function readAsBase64(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onload = function(){ resolve(r.result.split(',')[1]); };
    r.onerror = function(){ reject(new Error('อ่านไฟล์ ' + file.name + ' ไม่ได้')); };
    r.readAsDataURL(file);
  });
}

function setSave(msg, isErr){ setStatusEl('saveStatus', msg, isErr); }
function resetForm(){
  ['aTitle','aNumber','aProject','aTags','aSummary'].forEach(function(id){ el(id).value=''; });
  el('aFiles').value = ''; el('aFileList').innerHTML = '';
}

/* ---------- ปุ่ม ---------- */
el('btnAdd').onclick = openAdd;
el('btnSave').onclick = saveDoc;
el('btnFolder').onclick = function(){ window.open(DATA.folderUrl, '_blank'); };
el('scrim').onclick = closePanels;
document.querySelectorAll('[data-close]').forEach(function(b){ b.onclick = closePanels; });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closePanels(); });

el('aFiles').onchange = function(){
  el('aFileList').innerHTML = Array.prototype.slice.call(this.files).map(function(f){
    return '<div>' + esc(f.name) + ' — ' + Math.round(f.size/1024) + ' KB</div>'; }).join('');
};

el('q').oninput = render;
['fYear','fType','fProject','fStatus'].forEach(function(id){ el(id).onchange = render; });
el('vList').onclick = function(){ VIEW='list'; this.setAttribute('aria-pressed','true');
  el('vGrid').setAttribute('aria-pressed','false'); render(); };
el('vGrid').onclick = function(){ VIEW='grid'; this.setAttribute('aria-pressed','true');
  el('vList').setAttribute('aria-pressed','false'); render(); };

el('btnImport').onclick = function(){
  var b = this; b.disabled = true; b.textContent = 'กำลังนำเข้า…';
  call('import').then(function(res){
    b.disabled = false; b.textContent = 'นำเข้าไฟล์เดิม';
    el('count').textContent = res.imported
      ? 'นำเข้า ' + res.imported + ' ไฟล์แล้ว กดซ้ำได้ถ้ายังมีไฟล์เหลือ'
      : 'ไม่มีไฟล์ใหม่ในโฟลเดอร์';
    load();
  }).catch(function(e){
    b.disabled = false; b.textContent = 'นำเข้าไฟล์เดิม';
    el('count').textContent = 'นำเข้าไม่สำเร็จ: ' + e.message;
  });
};

el('btnOcr').onclick = function(){
  if (!CURRENT) return;
  var b = this; b.disabled = true;
  setStatusEl('viewStatus','กำลังอ่านข้อความ…');
  call('ocr', { docId: CURRENT.docId }).then(function(res){
    b.disabled = false;
    setStatusEl('viewStatus',
      res.ok ? 'อ่านได้ ' + res.chars + ' ตัวอักษร ค้นหาคำในเอกสารนี้ได้แล้ว' : res.message, !res.ok);
    if (res.ok) load();
  }).catch(function(e){
    b.disabled = false;
    setStatusEl('viewStatus', e.message, true);
  });
};

el('btnCancelDoc').onclick = function(){
  if (!CURRENT) return;
  var next = CURRENT.status === 'ยกเลิก' ? 'ใช้งาน' : 'ยกเลิก';
  var b = this; b.disabled = true;
  call('status', { docId: CURRENT.docId, status: next }).then(function(){
    b.disabled = false; closePanels(); load();
  }).catch(function(e){
    b.disabled = false; setStatusEl('viewStatus', e.message, true);
  });
};

/* ---------- เริ่มทำงาน ---------- */
(function start(){
  if (!/^https:\/\/script\.google\.com\/.*\/exec$/.test(API_URL)){
    el('count').textContent = 'ยังไม่ได้ใส่ที่อยู่ของสคริปต์';
    el('results').innerHTML = '<div class="setup-msg"><h3>เหลืออีกขั้นเดียว</h3>' +
      '<p>เปิดไฟล์ index.html บน GitHub กดรูปดินสอเพื่อแก้ไข แล้ววาง URL ที่ได้จากการ deploy ' +
      'ลงในบรรทัด <code>var API_URL</code></p></div>';
    return;
  }
  load();
})();
</script>
